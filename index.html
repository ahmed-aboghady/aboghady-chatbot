<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Bot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px 20px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    header h2 {
      margin: 0;
      margin-left: auto;
    }

    input, textarea, button {
      font-family: inherit;
    }

    #apiKey {
      width: 300px;
      padding: 10px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: #111827;
      color: white;
    }

    #model {
      width: 230px;
      padding: 10px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: #111827;
      color: white;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
    }

    .assistant {
      background: #1f2937;
      border: 1px solid #374151;
    }

    .error {
      background: #7f1d1d;
    }

    .role {
      font-size: 12px;
      opacity: .7;
      margin-bottom: 5px;
    }

    footer {
      padding: 15px;
      background: #1f2937;
      border-top: 1px solid #374151;
    }

    #inputArea {
      max-width: 1000px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      min-height: 55px;
      max-height: 180px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #4b5563;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
    }

    #send {
      width: 100px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #send:hover {
      background: #1d4ed8;
    }

    #send:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #clear {
      padding: 10px 15px;
      border: 0;
      border-radius: 8px;
      background: #374151;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>

  <h2>🤖 My AI Bot</h2>

  <input
    id="apiKey"
    type="password"
    placeholder="ضع Groq API Key هنا"
  >

  <input
    id="model"
    type="text"
    value="openai/gpt-oss-120b"
    placeholder="اسم الموديل"
  >

  <button id="clear">مسح المحادثة</button>

</header>


<main id="chat">

  <div class="message assistant">
    <div class="role">AI</div>
    أهلاً بك 👋
    <br>
    ضع Groq API Key ثم اكتب رسالتك.
  </div>

</main>


<footer>

  <div id="inputArea">

    <textarea
      id="messageInput"
      placeholder="اكتب رسالتك هنا..."
    ></textarea>

    <button id="send">إرسال</button>

  </div>

</footer>


<script>

const API_URL =
  "https://api.groq.com/openai/v1/chat/completions";

const apiKeyInput =
  document.getElementById("apiKey");

const modelInput =
  document.getElementById("model");

const chat =
  document.getElementById("chat");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("send");

const clearButton =
  document.getElementById("clear");


// تحميل المفتاح من المتصفح
apiKeyInput.value =
  localStorage.getItem("groq_api_key") || "";


// سجل المحادثة
let messages = [];


// إضافة رسالة للشاشة
function addMessage(role, text, className = "") {

  const div = document.createElement("div");

  div.className =
    "message " +
    (role === "user" ? "user" : "assistant") +
    " " +
    className;

  const roleDiv =
    document.createElement("div");

  roleDiv.className = "role";

  roleDiv.textContent =
    role === "user" ? "أنت" : "AI";

  const content =
    document.createElement("div");

  content.textContent = text;

  div.appendChild(roleDiv);
  div.appendChild(content);

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

  return div;
}


// إرسال الرسالة
async function sendMessage() {

  const apiKey =
    apiKeyInput.value.trim();

  const model =
    modelInput.value.trim();

  const text =
    messageInput.value.trim();


  if (!apiKey) {

    alert("ضع Groq API Key أولاً.");

    apiKeyInput.focus();

    return;
  }


  if (!model) {

    alert("اكتب اسم الموديل.");

    modelInput.focus();

    return;
  }


  if (!text) return;


  // حفظ المفتاح محليًا
  localStorage.setItem(
    "groq_api_key",
    apiKey
  );


  // إضافة رسالة المستخدم
  addMessage("user", text);

  messages.push({
    role: "user",
    content: text
  });


  messageInput.value = "";

  sendButton.disabled = true;

  sendButton.textContent =
    "جاري...";


  const thinkingMessage =
    addMessage(
      "assistant",
      "يفكر..."
    );


  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Authorization":
            "Bearer " + apiKey

        },

        body: JSON.stringify({

          model: model,

          messages: messages

        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data?.error?.message ||
        "حدث خطأ في الاتصال بالـ API"
      );

    }


    const answer =
      data?.choices?.[0]?.message?.content;


    if (!answer) {

      throw new Error(
        "لم يتم استلام رد من الموديل."
      );

    }


    // استبدال "يفكر..."
    thinkingMessage.remove();

    addMessage(
      "assistant",
      answer
    );


    messages.push({

      role: "assistant",

      content: answer

    });


  } catch (error) {

    thinkingMessage.remove();

    addMessage(
      "assistant",
      "حدث خطأ:\n" +
      error.message,
      "error"
    );

  }


  sendButton.disabled = false;

  sendButton.textContent =
    "إرسال";

  messageInput.focus();

}


// زر الإرسال
sendButton.addEventListener(
  "click",
  sendMessage
);


// Ctrl + Enter للإرسال
messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.ctrlKey &&
      event.key === "Enter"
    ) {

      sendMessage();

    }

  }
);


// مسح المحادثة
clearButton.addEventListener(
  "click",
  function() {

    messages = [];

    chat.innerHTML = "";

    addMessage(
      "assistant",
      "تم مسح المحادثة. ابدأ محادثة جديدة."
    );

  }
);

</script>

</body>
</html>
