<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venice Light Chat</title>
    <!-- Tailwind CSS للتنسيق السريع والخفيف -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 text-center shadow-md">
        <h1 class="text-xl font-bold text-teal-400">Venice Uncensored Chat</h1>
        <p class="text-xs text-slate-400 mt-1">واجهة خفيفة ومخصصة للموبايل</p>
    </header>

    <!-- Chat Messages Container -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="bg-slate-800 p-3 rounded-lg max-w-[85%] self-start border border-slate-700 text-sm leading-relaxed">
            مرحبًا! هذه واجهة خفيفة للاتصال بنموذج Venice AI بدون أي قيود أو ثقل على الموبايل. اكتب سؤالك وستصلك الإجابة فورًا.
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-slate-800 p-3 border-t border-slate-700">
        <form id="chat-form" onsubmit="handleSubmit(event)" class="flex gap-2 max-w-4xl mx-auto">
            <input 
                type="text" 
                id="user-input" 
                placeholder="اكتب رسالتك هنا..." 
                required
                class="flex-1 bg-slate-900 text-slate-100 text-sm rounded-lg px-4 py-3 border border-slate-700 focus:outline-none focus:border-teal-500"
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-teal-600 hover:bg-teal-500 text-white font-medium px-5 py-3 rounded-lg text-sm transition-all flex items-center justify-center min-w-[70px]"
            >
                إرسال
            </button>
        </form>
    </footer>

    <script>
        // ضع مفتاح الـ API الخاص بك هنا (سواء من OpenRouter أو Venice)
        const API_KEY = "YOUR_API_KEY_HERE"; 

        async function handleSubmit(e) {
            e.preventDefault();
            const input = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const sendBtn = document.getElementById("send-btn");

            const text = input.value.trim();
            if (!text) return;

            // 1. إضافة رسالة المستخدم
            chatBox.innerHTML += `
                <div class="bg-teal-700 text-white p-3 rounded-lg max-w-[85%] mr-auto text-sm leading-relaxed shadow-sm">
                    ${escapeHtml(text)}
                </div>
            `;
            input.value = "";
            scrollToBottom();

            // 2. إضافة مؤشر الانتظار
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="bg-slate-800 p-3 rounded-lg max-w-[85%] ml-auto border border-slate-700 text-sm text-slate-400 animate-pulse">
                    جاري التفكير...
                </div>
            `;
            scrollToBottom();

            // تعطيل زر الإرسال أثناء المعالجة
            sendBtn.disabled = true;

            try {
                // الاتصال بـ OpenRouter لاستخدام نموذج Venice المجاني وغير المقيد
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "venice/uncensored:free",
                        "messages": [{ "role": "user", "content": text }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    chatBox.innerHTML += `
                        <div class="bg-slate-800 p-3 rounded-lg max-w-[85%] ml-auto border border-slate-700 text-sm leading-relaxed text-slate-100">
                            ${escapeHtml(aiReply).replace(/\n/g, '<br>')}
                        </div>
                    `;
                } else {
                    throw new Error("فشل الحصول على رد من الـ API");
                }

            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="bg-red-900/50 text-red-200 border border-red-800 p-3 rounded-lg max-w-[85%] ml-auto text-sm">
                        حدث خطأ أثناء الاتصال بالنموذج. تأكد من صحة الـ API Key وإعدادات الشبكة.
                    </div>
                `;
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function scrollToBottom() {
            const chatBox = document.getElementById("chat-box");
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
