```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تحديث النظام</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #eef3f8, #dfe8f1);
            color: #333;
        }

        .container {
            width: min(92%, 560px);
            padding: 35px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f1ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            margin: 0 0 10px;
            color: #0056b3;
            font-size: 27px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.7;
        }

        .loader {
            width: 55px;
            height: 55px;
            margin: 20px auto;
            border: 5px solid #e9ecef;
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .progress-container {
            width: 100%;
            height: 10px;
            margin: 25px 0 12px;
            background: #e9ecef;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #3498db;
            transition: width 0.3s ease;
        }

        #progressText {
            font-size: 14px;
            color: #666;
        }

        #status {
            margin-top: 20px;
            font-weight: 600;
            color: #444;
        }

        .success {
            color: #198754 !important;
        }

        .error {
            color: #dc3545 !important;
        }

        button {
            display: none;
            margin-top: 22px;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            background: #0056b3;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #004494;
        }

        .notice {
            margin-top: 25px;
            padding: 10px;
            border-radius: 8px;
            background: #f8f9fa;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">⚙️</div>

    <h1>جاري تحديث النظام...</h1>

    <p class="description">
        يرجى الانتظار حتى يتم التحقق من المكونات المطلوبة.
    </p>

    <div class="loader" id="loader"></div>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <div id="progressText">0%</div>

    <p id="status">التحضير للتحديث...</p>

    <button id="continueBtn">
        متابعة
    </button>

    <div class="notice">
        هذه صفحة تعليمية لمحاكاة عملية تحديث النظام.
        لا يتم تشغيل أو تثبيت أي ملفات تنفيذية.
    </div>

</div>

<script>
    "use strict";

    const progress = document.getElementById("progress");
    const progressText = document.getElementById("progressText");
    const status = document.getElementById("status");
    const loader = document.getElementById("loader");
    const continueBtn = document.getElementById("continueBtn");

    const steps = [
        {
            percent: 20,
            text: "جاري فحص الاتصال..."
        },
        {
            percent: 40,
            text: "جاري التحقق من المكونات..."
        },
        {
            percent: 60,
            text: "جاري تجهيز ملفات التحديث..."
        },
        {
            percent: 80,
            text: "جاري التحقق من سلامة الملفات..."
        },
        {
            percent: 100,
            text: "اكتمل التحديث بنجاح."
        }
    ];

    let currentStep = 0;

    function updateProgress() {

        if (currentStep >= steps.length) {
            finishUpdate();
            return;
        }

        const step = steps[currentStep];

        progress.style.width = step.percent + "%";
        progressText.textContent = step.percent + "%";
        status.textContent = step.text;

        currentStep++;

        setTimeout(updateProgress, 900);
    }

    function finishUpdate() {

        loader.style.display = "none";

        status.textContent =
            "تم التحقق من جميع المكونات بنجاح.";

        status.classList.add("success");

        continueBtn.style.display = "inline-block";
    }

    continueBtn.addEventListener("click", function () {

        status.textContent =
            "تمت المتابعة بنجاح.";

        continueBtn.disabled = true;
        continueBtn.textContent = "تم";
    });

    // بدء المحاكاة بعد فترة قصيرة
    setTimeout(updateProgress, 1200);
</script>

</body>
</html>
